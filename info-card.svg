<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     width="640" height="350">
  <defs>
    <clipPath id="card-round">
      <rect x="0" y="0" width="640" height="350" rx="10" ry="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-round)">
    <rect width="640" height="350" fill="#0d1117" />
    <rect width="640" height="350" fill="none" stroke="#30363d" stroke-width="1" />

    <!-- title bar -->
    <rect x="0" y="0" width="640" height="46" fill="#161b22" />
    <line x1="0" y1="46" x2="640" y2="46" stroke="#30363d" stroke-width="1" />
    <circle cx="24" cy="23.0" r="6" fill="#ff5f56" />
    <circle cx="44" cy="23.0" r="6" fill="#ffbd2e" />
    <circle cx="64" cy="23.0" r="6" fill="#27c93f" />
    <text x="320.0" y="28.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="13"
          fill="#c9d1d9" text-anchor="middle">neofetch</text>

    <!-- prompt line -->
    <text x="28" y="72" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="14" fill="#58a6ff" font-weight="bold">siyavashist67@github</text>
    <line x1="28" y1="80" x2="200"
          y2="80" stroke="#30363d" stroke-width="1" />

    
    <g opacity="0" transform="translate(-16, 0)">
      
        <animate attributeName="opacity" from="0" to="1"
                 begin="0.300s" dur="0.5s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
                 from="-16 0" to="0 0"
                 begin="0.300s" dur="0.5s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0 0.2 1" />
      <text x="28" y="133.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="15" fill="#39d353" font-weight="bold">Role</text>
      <text x="178" y="133.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="14" fill="#c9d1d9">Psychology Hons Grad → HR &amp; Talent Acquisition</text>
    </g>

    <g opacity="0" transform="translate(-16, 0)">
      
        <animate attributeName="opacity" from="0" to="1"
                 begin="0.480s" dur="0.5s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
                 from="-16 0" to="0 0"
                 begin="0.480s" dur="0.5s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0 0.2 1" />
      <text x="28" y="177.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="15" fill="#39d353" font-weight="bold">Focus</text>
      <text x="178" y="177.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="14" fill="#c9d1d9">Talent Attraction, People Analytics, HR Transformation</text>
    </g>

    <g opacity="0" transform="translate(-16, 0)">
      
        <animate attributeName="opacity" from="0" to="1"
                 begin="0.660s" dur="0.5s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
                 from="-16 0" to="0 0"
                 begin="0.660s" dur="0.5s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0 0.2 1" />
      <text x="28" y="221.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="15" fill="#39d353" font-weight="bold">Stack</text>
      <text x="178" y="221.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="14" fill="#c9d1d9">R, Jamovi, JASP, Excel, LaTeX</text>
    </g>

    <g opacity="0" transform="translate(-16, 0)">
      
        <animate attributeName="opacity" from="0" to="1"
                 begin="0.840s" dur="0.5s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
                 from="-16 0" to="0 0"
                 begin="0.840s" dur="0.5s" fill="freeze"
