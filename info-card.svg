      <text x="28" y="265.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="15" fill="#39d353" font-weight="bold">Highlights</text>
      <text x="178" y="265.0" font-family="'SF Mono','Consolas','Menlo',monospace" font-size="14" fill="#c9d1d9">Cum Laude | Dean's Honour Roll | York University</text>
    </g>

    <g opacity="0" transform="translate(-16, 0)">
      
        <animate attributeName="opacity" from="0" to="1"
                 begin="1.020s" dur="0.5s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
                 from="-16 0" to="0 0"
                 begin="1.020s" dur="0.5s" fill="freeze"
                 calcMode="spline" keySplines="0.2 0 0.2 1" />
